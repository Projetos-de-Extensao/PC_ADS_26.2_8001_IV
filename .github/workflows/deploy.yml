# Publica o site (MkDocs) automaticamente a cada commit na branch main.
# O site gerado vai para a branch gh-pages, que alimenta o link do "About":
# https://projetos-de-extensao.github.io/PC_ADS_26.2_8001_IV/

name: Publicar site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Configurar autor do commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Gerar e publicar o site
        run: mkdocs gh-deploy --force
